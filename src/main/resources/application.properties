# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8080

# ===================================================================
# POSTGRESQL DATABASE CONFIGURATION
# ===================================================================
# Asigură-te că baza de date 'nightluxe' este creată în pgAdmin/psql
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
# TODO: Schimbă cu parola ta reală de la baza de date locală
spring.datasource.password=Seby31may
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# HIBERNATE & JPA (Object-Relational Mapping)
# ===================================================================
# 'update' va crea sau actualiza tabelele automat pe baza entităților tale.
# Conform FDD, este perfect pentru dev. În producție vom trece pe 'validate'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# JWT SECURITY CONFIGURATION
# ===================================================================
# Cheia secretă trebuie să aibă minim 256 biți (32 caractere)
jwt.secret=w9zB3vF8qR5yH2mP7sK4tN1cV6xJ0dG3bA5lE8nY2oQ=
# Expirarea token-ului în milisecunde (aici e setat la 24 de ore: 24 * 60 * 60 * 1000)
jwt.expiration=86400000